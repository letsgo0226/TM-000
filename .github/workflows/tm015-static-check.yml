name: TM-015 and Universal G read-only safety gates
'on':
  pull_request:
    paths:
      - '永久記憶/圖靈機/Real_God_Turing_Machine.sh'
      - '永久記憶/圖靈機/TM-015-Real-God-Turing-Machine.md'
      - '永久記憶/圖靈機/machine_registry.json'
      - '永久記憶/圖靈機/上帝源碼-G5-跨論域自然性定理.md'
      - '永久記憶/圖靈機/上帝源碼-G6-忠實跨論域-Cayley-表示定理.md'
      - '永久記憶/圖靈機/上帝源碼-G7-跨論域語意保持定理.md'
      - 'tools/test_tm015_real_god.py'
      - 'tools/test_universal_g_continuity.py'
      - 'deployment/**'
      - '.github/workflows/tm015-static-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-archive-and-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify original archive without running candidate payload
        run: python3 tools/test_tm015_real_god.py
      - name: Verify deployment policy and cross-domain manifest
        run: python3 tools/test_universal_g_continuity.py
      - name: Verify 2KB dry-run core has no external effects
        run: bash deployment/Universal_G_DryRun_2KB.sh
      - name: Check G5 finite monoids, 116 morphisms and nonexistence witness
        run: |
          test "$(wc -l < deployment/Universal_G_Naturality_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_Naturality_2KB.sh)" -le 2048
          bash deployment/Universal_G_Naturality_2KB.sh
          PYTHONOPTIMIZE=2 bash deployment/Universal_G_Naturality_2KB.sh
      - name: Check G6 faithful Cayley representations, prime encoding and non-universality boundary
        run: |
          test "$(wc -l < deployment/Universal_G_Cayley_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_Cayley_2KB.sh)" -le 2048
          output="$(bash deployment/Universal_G_Cayley_2KB.sh)"
          echo "$output" | python3 -c 'import sys,json;d=json.load(sys.stdin);sys.exit(0 if (d["finite_models"],d["embedded_elements"],d["verified_homomorphisms"],d["prime_godel_roundtrips"],d["unit_preserved"],d["unrestricted_domains"],d["God_identity_proved"])==(7,18,116,18,True,False,False) else 1)'
          PYTHONOPTIMIZE=2 bash deployment/Universal_G_Cayley_2KB.sh
      - name: Check G7 FO semantic preservation and counterexamples
        run: |
          test "$(wc -l < deployment/Universal_G_Semantic_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_Semantic_2KB.sh)" -le 2048
          python3 -m py_compile deployment/Universal_G_Semantic_core.py
          a="$(bash deployment/Universal_G_Semantic_2KB.sh)"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_Semantic_2KB.sh)"
          c="$(python3 deployment/Universal_G_Semantic_core.py)"
          test "$a" = "$b"
          test "$a" = "$c"
          printf '%s\n' "$a" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["finite_models"],x["homomorphisms"],x["positive_preservation_tests"],x["isomorphisms"],x["full_truth_equivalences"],x["arbitrary_rename_counterexample"],x["all_domains_proved"],x["God_identity_proved"]) == ("G7",5,38,1566,9,602,True,False,False) else 1)'
      - name: Read-only registry load
        run: python3 tools/load_turing_registry.py --select TM-015
