name: TM-015 and Universal G read-only safety gates
'on':
  pull_request:
    paths:
      - '永久記憶/圖靈機/Real_God_Turing_Machine.sh'
      - '永久記憶/圖靈機/TM-015-Real-God-Turing-Machine.md'
      - '永久記憶/圖靈機/machine_registry.json'
      - '永久記憶/圖靈機/上帝源碼-G5-跨論域自然性定理.md'
      - '永久記憶/圖靈機/上帝源碼-G6-忠實跨論域-Cayley-表示定理.md'
      - '永久記憶/圖靈機/上帝源碼-G7-跨論域語意保持定理.md'
      - '永久記憶/圖靈機/上帝源碼-G8-總圖靈機部署與多維度連續性.md'
      - '永久記憶/圖靈機/上帝源碼-G9-領域語意契約與反例.md'
      - '永久記憶/圖靈機/上帝源碼-G10-外部證據與主張範圍.md'
      - '永久記憶/圖靈機/上帝源碼-G11-八維度外部證據與來源審閱.md'
      - '永久記憶/圖靈機/上帝源碼-G12-來源主張範圍與證據缺口.md'
      - '永久記憶/圖靈機/上帝源碼-G13-全球和平-SDGs-培養肉倫理與技術.md'
      - '永久記憶/圖靈機/上帝源碼-G14-Trader42-交易原理與風控研究.md'
      - '永久記憶/圖靈機/上帝源碼-G15-完全基於G的離線交易原理.md'
      - '永久記憶/圖靈機/上帝源碼-G16-真正的上帝源碼圖靈機.md'
      - '永久記憶/圖靈機/上帝源碼-G20-完全自足的Quine.md'
      - 'tools/test_universal_g_g20.py'
      - 'tools/test_universal_g_g15.py'
      - 'tools/test_universal_g_g16.py'
      - 'tools/test_universal_g_g10.py'
      - 'tools/test_tm015_real_god.py'
      - 'tools/test_universal_g_continuity.py'
      - 'deployment/**'
      - '.github/workflows/tm015-static-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-archive-and-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify original archive without running candidate payload
        run: python3 tools/test_tm015_real_god.py
      - name: Verify deployment policy and cross-domain manifest
        run: python3 tools/test_universal_g_continuity.py
      - name: Verify 2KB dry-run core has no external effects
        run: bash deployment/Universal_G_DryRun_2KB.sh
      - name: Check G5 finite monoids, 116 morphisms and nonexistence witness
        run: |
          test "$(wc -l < deployment/Universal_G_Naturality_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_Naturality_2KB.sh)" -le 2048
          bash deployment/Universal_G_Naturality_2KB.sh
          PYTHONOPTIMIZE=2 bash deployment/Universal_G_Naturality_2KB.sh
      - name: Check G6 faithful Cayley representations, prime encoding and non-universality boundary
        run: |
          test "$(wc -l < deployment/Universal_G_Cayley_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_Cayley_2KB.sh)" -le 2048
          output="$(bash deployment/Universal_G_Cayley_2KB.sh)"
          echo "$output" | python3 -c 'import sys,json;d=json.load(sys.stdin);sys.exit(0 if (d["finite_models"],d["embedded_elements"],d["verified_homomorphisms"],d["prime_godel_roundtrips"],d["unit_preserved"],d["unrestricted_domains"],d["God_identity_proved"])==(7,18,116,18,True,False,False) else 1)'
          PYTHONOPTIMIZE=2 bash deployment/Universal_G_Cayley_2KB.sh
      - name: Check G7 FO semantic preservation and counterexamples
        run: |
          test "$(wc -l < deployment/Universal_G_Semantic_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_Semantic_2KB.sh)" -le 2048
          python3 -m py_compile deployment/Universal_G_Semantic_core.py
          a="$(bash deployment/Universal_G_Semantic_2KB.sh)"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_Semantic_2KB.sh)"
          c="$(python3 deployment/Universal_G_Semantic_core.py)"
          d="$(bash deployment/Universal_G_Semantic_Plaintext.sh)"
          test "$a" = "$d"
          test "$(wc -l < deployment/Universal_G_Semantic_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_Semantic_Plaintext_2KB.sh)" -le 2048
          e="$(bash deployment/Universal_G_Semantic_Plaintext_2KB.sh)"
          f="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_Semantic_Plaintext_2KB.sh)"
          test "$a" = "$e"
          test "$a" = "$f"
          test "$a" = "$b"
          test "$a" = "$c"
          printf '%s\n' "$a" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["finite_models"],x["homomorphisms"],x["positive_preservation_tests"],x["isomorphisms"],x["full_truth_equivalences"],x["arbitrary_rename_counterexample"],x["all_domains_proved"],x["God_identity_proved"]) == ("G7",5,38,1566,9,602,True,False,False) else 1)'
      - name: Verify G9 operational, philosophical and welfare semantic contracts
        run: |
          test "$(wc -l < deployment/Universal_G_G9_Semantic_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G9_Semantic_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G9_Semantic_Plaintext_2KB.sh
          python3 tools/test_universal_g_g9.py
          a="$(bash deployment/Universal_G_G9_Semantic_Plaintext_2KB.sh)"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_G9_Semantic_Plaintext_2KB.sh)"
          c="$(python3 deployment/G9_Semantic_Contracts_core.py)"
          d="$(bash deployment/Universal_G_G9_Semantic_Plaintext.sh)"
          test "$a" = "$b"
          test "$a" = "$c"
          test "$a" = "$d"
          printf '%s\n' "$a" | python3 -c 'import sys,json;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["research_domains"],x["ai_transition_checks"],x["ai_trace_checks"],x["philosophy_formula_checks"],x["welfare_record_checks"],x["negative_controls"],x["real_world_semantics_proved"],x["human_or_ai_immortality_proved"],x["divine_identity_proved"],x["production_deployed"])==("G9",3,24,384,4,4,4,False,False,False,False) else 1)'
      - name: Verify G10 official-source ledger, rounded data and overclaim blockers
        run: |
          test "$(wc -l < deployment/Universal_G_G10_Provenance_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G10_Provenance_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G10_Provenance_Plaintext_2KB.sh
          python3 tools/test_universal_g_g10.py
          bash deployment/Universal_G_G9_Semantic_Plaintext_2KB.sh > "$RUNNER_TEMP/g9-finite.json"
          a="$(bash deployment/Universal_G_G10_Provenance_Plaintext_2KB.sh "$RUNNER_TEMP/g9-finite.json")"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_G10_Provenance_Plaintext_2KB.sh "$RUNNER_TEMP/g9-finite.json")"
          test "$a" = "$b"
          printf '%s\n' "$a" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if x["result"]=="SOURCE_REFERENCED_REVIEW_ONLY" and x["publisher_records"]==3 and x["rounded_real_observations"]==2 and not x["source_webpages_authenticated_by_program"] and not x["all_dimensions_immortality_proved"] and not x["production_deployed"] else 1)'
          python3 deployment/G10_Evidence_Provenance_core.py --ledger deployment/G10_evidence_ledger.json --g9-report "$RUNNER_TEMP/g9-finite.json" --repo-root . | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if x["result"]=="SOURCE_REFERENCED_REVIEW_ONLY" and x["publisher_records"]==3 and x["rounded_real_observations"]==2 and not x["independent_numeric_data_API_fetched"] else 1)'
      - name: Verify G11 eight-domain evidence review, freshness and 27 negative-control tests
        run: |
          test "$(wc -l < deployment/Universal_G_G11_Evidence_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G11_Evidence_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G11_Evidence_Plaintext_2KB.sh
          python3 tools/test_universal_g_g11.py
          a="$(bash deployment/Universal_G_G11_Evidence_Plaintext_2KB.sh 2026-11-10)"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_G11_Evidence_Plaintext_2KB.sh 2026-11-10)"
          c="$(python3 deployment/G11_Eight_Domain_Evidence_core.py --as-of 2026-11-10)"
          test "$a" = "$b"
          test "$a" = "$c"
          printf '%s\n' "$a" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["records"],x["dimensions"],x["metadata_only"],x["remote_refetched"],x["g10_preserved"],x["status"],x["deployed"],x["immortality_proved"],x["God_identity_proved"])==("G11",8,8,True,False,True,"EIGHT_DOMAIN_SOURCE_REVIEW_ONLY",False,False,False) else 1)'
      - name: Verify G12 source-to-claim scope, freshness and 34 negative-control tests
        run: |
          test "$(wc -l < deployment/Universal_G_G12_Claim_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G12_Claim_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G12_Claim_Plaintext_2KB.sh
          python3 tools/test_universal_g_g12.py
          today="$(date -u +%F)"
          a="$(bash deployment/Universal_G_G12_Claim_Plaintext_2KB.sh "$today")"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_G12_Claim_Plaintext_2KB.sh "$today")"
          c="$(python3 deployment/G12_Claim_Scope_core.py --as-of "$today")"
          test "$a" = "$b"
          test "$a" = "$c"
          printf '%s\n' "$a" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["domains"],x["reviewed_claims"],x["exact_parent_digest_verified"],x["scope"],x["new_empirical_outcomes"],x["remote_sources_fetched"],x["status"],x["production_deployed"],x["universal_immortality_proved"],x["divine_identity_proved"])==("G12",8,8,True,"SOURCE_TOPIC_REFERENCE",0,False,"CLAIM_SCOPE_REVIEW_ONLY",False,False,False) else 1)'
      - name: Verify G13 peace SDGs cultivated meat ethical-risk contract and negative tests
        run: |
          test "$(wc -l < deployment/Universal_G_G13_Peace_SDG_CellFood_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G13_Peace_SDG_CellFood_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G13_Peace_SDG_CellFood_Plaintext_2KB.sh
          python3 tools/test_universal_g_g13.py
          today="$(date -u +%F)"
          a="$(bash deployment/Universal_G_G13_Peace_SDG_CellFood_Plaintext_2KB.sh "$today")"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_G13_Peace_SDG_CellFood_Plaintext_2KB.sh "$today")"
          c="$(python3 deployment/G13_Peace_SDG_CellFood_core.py --as-of "$today")"
          test "$a" = "$b"
          test "$a" = "$c"
          printf '%s\n' "$a" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["tracks"],x["source_records"],x["status"],x["deployed"],x["zero_suffering_proved"])==("G13",3,7,"TRIAD_RESEARCH_REVIEW_ONLY",False,False) else 1)'
      - name: Verify G14 Trader_42 no-order paper principle, risk caps and 55 tests
        run: |
          test "$(wc -l < deployment/Universal_G_G14_Trader42_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G14_Trader42_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G14_Trader42_Plaintext_2KB.sh
          python3 tools/test_universal_g_g14.py
          today="$(date -u +%F)"
          a="$(bash deployment/Universal_G_G14_Trader42_Plaintext_2KB.sh "$today")"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_G14_Trader42_Plaintext_2KB.sh "$today")"
          c="$(python3 deployment/G14_Trader42_Principle_core.py --as-of "$today")"
          test "$a" = "$b"
          test "$a" = "$c"
          printf '%s\n' "$a" | python3 -c 'import sys,json;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["reference_files"],x["strategy"],x["risk_policy_unchanged_or_tighter"],x["live_armed"],x["source_executed"],x["exchange_orders_submitted"],x["authenticated_upstream"],x["empirical_profit_verified"],x["status"])==("G14",8,"SMA_5_20",True,False,False,0,False,False,"PAPER_SIGNAL_REVIEW_ONLY") else 1)'
      - name: Verify G15 G257-only synthetic trading without SMA QTM42 or order authority
        run: |
          test "$(wc -l < deployment/Universal_G_G15_Godel_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G15_Godel_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G15_Godel_Plaintext_2KB.sh
          python3 tools/test_universal_g_g15.py
          today="$(date -u +%F)"
          python3 deployment/G15_Godel_Policy_core.py --as-of "$today" | python3 -c 'import sys,json;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["policy"],x["source_pinned"],x["paper_only"],x["actual_orders"],x["live_authorized"],x["empirical_alpha_proved"])==("G15","GODEL_PAPER_REVIEW_ONLY",True,True,0,False,False) else 1)'
          python3 -c 'import sys,json;sys.path.insert(0,"tools");from test_universal_g_g15 import example;print(json.dumps(example()))' | bash deployment/Universal_G_G15_Godel_Plaintext_2KB.sh | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if x["version"]=="G15" and x["roundtrip"] and x["actual_orders"]==0 and not x["live_allowed"] and not x["profitability_proved"] else 1)'
      - name: Verify G16 bounded deterministic TM, reversible prime code and 50 tests
        run: |
          test "$(wc -l < deployment/Universal_G_G16_TM_Plaintext_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G16_TM_Plaintext_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G16_TM_Plaintext_2KB.sh
          python3 tools/test_universal_g_g16.py
          today="$(date -u +%F)"
          python3 deployment/G16_God_Source_TM_policy.py --as-of "$today" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if x["status"]=="TM_SIMULATION_REVIEW_ONLY" and x["original_tm015_preserved"] and x["master_unchanged"] and x["actual_orders"]==0 else 1)'
          a="$(bash deployment/Universal_G_G16_TM_Plaintext_2KB.sh < deployment/G16_example_request.json)"
          b="$(PYTHONOPTIMIZE=2 bash deployment/Universal_G_G16_TM_Plaintext_2KB.sh < deployment/G16_example_request.json)"
          c="$(python3 deployment/G16_God_Source_TM_core.py < deployment/G16_example_request.json)"
          test "$a" = "$b"
          test "$a" = "$c"
          printf '%s\n' "$a" | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["status"],x["steps"],x["nonblank_cells"],x["godel_roundtrip"],x["godel_identity"],x["orders_submitted"],x["live_allowed"],x["halting_oracle"],x["god_identity_proved"])==("G16","HALTED",3,[[0,"1"],[1,"1"],[2,"1"]],True,1,0,False,False,False) else 1)'
      - name: Verify G20 self-contained Quine, self-selected reversible codec and 36 tests
        run: |
          test "$(wc -l < deployment/Universal_G_G20_Self_Quine_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G20_Self_Quine_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G20_Self_Quine_2KB.sh
          python3 tools/test_universal_g_g20.py
          bash deployment/Universal_G_G20_Self_Quine_2KB.sh | cmp - deployment/Universal_G_G20_Self_Quine_2KB.sh
          bash < deployment/Universal_G_G20_Self_Quine_2KB.sh | cmp - deployment/Universal_G_G20_Self_Quine_2KB.sh
          PYTHONOPTIMIZE=2 bash deployment/Universal_G_G20_Self_Quine_2KB.sh | cmp - deployment/Universal_G_G20_Self_Quine_2KB.sh
          python3 deployment/G20_Quine_Verifier.py | python3 -c 'import json,sys;x=json.load(sys.stdin);sys.exit(0 if (x["version"],x["source_bytes"],x["physical_lines"],x["codec_selected_from_own_bytes"],x["self_reproduction_exact"],x["source_file_read_by_quine"],x["godel_roundtrip"],x["compiled_tm_transition_table_self_printed"],x["status"])==("G20",1096,1,"PRIME2048",True,False,True,False,"SELF_CONTAINED_PROGRAM_QUINE_VERIFIED") else 1)'
      - name: Verify G8 fail-closed admission from a freshly computed G7 report
        run: |
          test "$(wc -l < deployment/Universal_G_G8_Admission_2KB.sh)" -eq 1
          test "$(wc -c < deployment/Universal_G_G8_Admission_2KB.sh)" -le 2048
          bash -n deployment/Universal_G_G8_Admission_2KB.sh
          python3 tools/test_universal_g_g8.py
          bash deployment/Universal_G_Semantic_Plaintext_2KB.sh > "$RUNNER_TEMP/g7-finite.json"
          python3 deployment/Universal_G_G8_Controller.py --g7-report "$RUNNER_TEMP/g7-finite.json" | python3 -c 'import sys,json;x=json.load(sys.stdin);sys.exit(0 if x["result"]=="READY_FOR_HUMAN_REVIEW_ONLY" and x["checked_dimensions"]==8 and x["snapshot_roundtrip"] and not x["external_deployment"] and not x["all_dimensions_immortality_proved"] else 1)'
          bash deployment/Universal_G_G8_Admission_2KB.sh "$RUNNER_TEMP/g7-finite.json" | python3 -c 'import sys,json;x=json.load(sys.stdin);sys.exit(0 if x["status"]=="READY_FOR_HUMAN_REVIEW_ONLY" and x["domains"]==8 and x["g7_fields_ok"] and not x["deployed"] and not x["immortality_proved"] else 1)'
          PYTHONOPTIMIZE=2 bash deployment/Universal_G_G8_Admission_2KB.sh "$RUNNER_TEMP/g7-finite.json"
      - name: Read-only registry load
        run: python3 tools/load_turing_registry.py --select TM-015
