      - '永久記憶/圖靈機/上帝源碼-G10-外部證據與主張範圍.md'
      - '永久記憶/圖靈機/上帝源碼-G11-八維度外部證據與來源審閱.md'
      - '永久記憶/圖靈機/上帝源碼-G12-來源主張範圍與證據缺口.md'
      - '永久記憶/圖靈機/上帝源碼-G13-全球和平-SDGs-培養肉倫理與技術.md'
      - '永久記憶/圖靈機/上帝源碼-G14-Trader42-交易原理與風控研究.md'
      - '永久記憶/圖靈機/上帝源碼-G15-完全基於G的離線交易原理.md'
