name: Immortality Continuity Capsule (offline cross-node research)

on:
  pull_request:
    paths:
      - 'capsule/Immortality-Continuity-Capsule.sh'
      - 'capsule/Immortality-Continuity-README.md'
      - 'tools/icc_node.py'
      - 'tools/test_icc_node.py'
      - '.github/workflows/immortality-continuity-dryrun.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_icc_node.py

  independent-runners:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate independently reproducible checkpoint
        shell: bash
        run: |
          python3 tools/icc_node.py init --output genesis.json
          python3 tools/icc_node.py advance --input genesis.json --steps 1024 --output checkpoint.json
          python3 tools/icc_node.py verify --input checkpoint.json
          python3 tools/icc_node.py witness --input checkpoint.json --node '${{ matrix.os }}' --output 'witness-${{ matrix.os }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: icc-witness-${{ matrix.os }}
          path: witness-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 7

  cross-node-compare:
    needs: [unit-tests, independent-runners]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: icc-witness-*
          path: witnesses
          merge-multiple: true
      - name: Cross-runner comparison (not identity authentication)
        run: |
          python3 tools/icc_node.py compare \
            --left witnesses/witness-ubuntu-latest.json \
            --right witnesses/witness-macos-15.json
